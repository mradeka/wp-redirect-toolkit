name: shellcheck

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check (bash -n)
        run: |
          for f in *.sh; do
            echo "== $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: shellcheck -S warning *.sh

      - name: Help output must not error
        run: |
          for f in *.sh; do
            case "$f" in install.sh) continue ;; esac
            bash "$f" --help > /dev/null
          done

      - name: Reserved bash variable names
        run: |
          if grep -nE '^[[:space:]]*(GROUPS|SECONDS|RANDOM|LINENO|PIPESTATUS|FUNCNAME|UID|EUID|PPID|REPLY|OPTIND|OPTARG|PWD|OLDPWD)(\+)?=' *.sh; then
            echo "Assignment to a reserved bash variable - this silently breaks loops."
            exit 1
          fi
          echo "no reserved variable names assigned"

      - name: Refuse to ship secrets
        run: |
          if grep -rInE '(password|passwd|secret)[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"'$]{6,}' \
               --include='*.sh' --include='*.md' . ; then
            echo "Possible hard-coded credential found."
            exit 1
          fi
          echo "no hard-coded credentials"
